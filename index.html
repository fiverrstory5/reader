<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Text Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
        }

        /* Right-Aligned Transparent Floating Toolbar */
        .floating-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-paste {
            background: rgba(37, 99, 235, 0.4);
            border-color: rgba(37, 99, 235, 0.5);
        }
        .btn-paste:hover {
            background: rgba(37, 99, 235, 0.7);
        }

        .btn-clear {
            background: rgba(220, 38, 38, 0.3);
            border-color: rgba(220, 38, 38, 0.4);
        }
        .btn-clear:hover {
            background: rgba(220, 38, 38, 0.6);
        }

        /* Editable Workspace Area (Extension Highlight Compatible) */
        #editor {
            width: 100vw;
            height: 100vh;
            padding: 80px 40px 40px 40px;
            font-size: 18px;
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #121212;
            border: none;
            outline: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #editor:empty:before {
            content: "यहाँ 'Paste' बटन दबाएं या Ctrl + V से टेक्स्ट पेस्ट करें...";
            color: #555555;
        }
    </style>
</head>
<body>

    <!-- Top Right Floating Buttons -->
    <div class="floating-bar">
        <button class="btn btn-paste" onclick="pasteText()">Paste</button>
        <button class="btn" onclick="selectAllText()">Select All</button>
        <button class="btn btn-clear" onclick="clearText()">Clear</button>
    </div>

    <!-- Fullscreen Editable Input Area -->
    <div id="editor" contenteditable="true" autofocus></div>

<script>
    const editor = document.getElementById('editor');
    const prefixText = "Hello.\n";

    // Select All Utility Function
    function selectAllText() {
        editor.focus();
        const range = document.createRange();
        range.selectNodeContents(editor);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }

    // 1. Paste from Clipboard with Prefix
    async function pasteText() {
        try {
            const clipboardContent = await navigator.clipboard.readText();
            if (clipboardContent) {
                editor.innerText = prefixText + clipboardContent;
                setTimeout(() => {
                    selectAllText();
                }, 30);
            }
        } catch (err) {
            alert('क्लिपबोर्ड एक्सेस करने के लिए कृपया परमिशन Allow करें या डायरेक्ट Ctrl+V का उपयोग करें।');
        }
    }

    // 2. Clear Function
    function clearText() {
        editor.innerText = '';
        editor.focus();
    }

    // 3. Manual Paste Event (Ctrl + V) with Prefix
    editor.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData('text');
        editor.innerText = prefixText + pastedData;
        
        setTimeout(() => {
            selectAllText();
        }, 30);
    });
</script>

</body>
</html>
