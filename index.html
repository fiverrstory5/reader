<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Text Workspace</title>
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="theme-color" content="#111215">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Minimal Floating Top Bar -->
    <div class="top-bar">
        <button class="btn btn-paste" id="btnPaste" title="Paste text (Ctrl + V)">
            Paste
        </button>

        <button class="btn btn-clear" id="btnClear" title="Clear workspace">
            Clear
        </button>

        <!-- Speed Scroller (Slider) -->
        <div class="slider-group" title="Scroll / Slide to adjust playback speed">
            <span class="slider-label">Speed:</span>
            <input type="range" id="speedSlider" min="0.75" max="2.5" step="0.05" value="1.45" class="speed-slider">
            <span id="speedValue" class="speed-badge">1.45x</span>
        </div>
    </div>

    <!-- Smart Auto-Scroll Resume Indicator -->
    <div class="scroll-resume-pill" id="scrollResumePill" title="Click to center back on the currently speaking sentence">
        📍 Auto-scroll paused (Click to resume)
    </div>

    <!-- Reading Canvas -->
    <div class="workspace" id="scrollContainer">
        <div class="editor" id="editor" contenteditable="true" autofocus
             placeholder="Paste text here (Ctrl + V) to start listening... (Double-click any sentence to jump)"></div>
    </div>

    <!-- Minimal Bottom Player Bar with Real-Time Timestamps -->
    <div class="bottom-player">
        <button class="ctrl-btn" id="btnPrev" title="Previous (Left Arrow)">⏮</button>
        <button class="ctrl-btn play-btn" id="btnPlayPause" title="Play / Pause (Space)">▶</button>
        <button class="ctrl-btn" id="btnNext" title="Next (Right Arrow)">⏭</button>

        <div class="track-wrapper">
            <div class="track-info">
                <div class="track-left">
                    <span id="lblTime" class="time-display">00:00 / 00:00</span>
                    <span id="lblCounter" class="counter-display">Line 0 / 0</span>
                </div>
                <span id="lblStatus" style="color: #71717a;">Ready</span>
            </div>
            <div class="track-bar" id="trackBar" title="Click to jump in timeline">
                <div class="track-fill" id="trackFill"></div>
            </div>
        </div>
    </div>

    <!-- Core Application Logic -->
    <script src="app.js"></script>
</body>
</html>
